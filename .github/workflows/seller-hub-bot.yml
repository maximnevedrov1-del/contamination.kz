# Seller Hub: the sellers' Telegram bot — morning digest at 09:00 Almaty (04:00 UTC), «6 days away»,
# grace reminders, win-back. Calls the bot function; runs only when the secrets are set
# (kaspi-seller-hub/billing/README.md → «Telegram-бот для продавцов»).
name: seller-hub-bot

# GitHub starts scheduled runs late (hours late at :00 — the digest came at 17:16–19:32 Almaty),
# so there are several tries off the round hour. Each digest is sent once per user and day
# (tg_sent dedupes by kind + key), so the later tries only send what an earlier one missed.
on:
  schedule:
    - cron: '7 4 * * *'   # 09:07 Almaty
    - cron: '37 4 * * *'  # 09:37
    - cron: '7 5 * * *'   # 10:07
    - cron: '7 6 * * *'   # 11:07
  workflow_dispatch:

permissions:
  contents: read

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      BOT_KEY: ${{ secrets.BOT_KEY }}
    steps:
      - name: Fail if secrets are missing
        if: env.BOT_KEY == '' || env.SUPABASE_URL == ''
        run: echo "::error::SUPABASE_URL / BOT_KEY secrets are not set" && exit 1
      - name: Send what is due
        run: |
          # One call sends for ~45 s and records results every 50 messages; "more": true → call again.
          # No curl --retry on a timeout: a cut-off call may have sent messages already (recorded ones are not repeated).
          for i in $(seq 1 20); do
            code=$(curl -sS --connect-timeout 15 --max-time 120 -o out.json -w '%{http_code}' -X POST "${SUPABASE_URL%/}/functions/v1/telegram-bot/run" -H "x-bot-key: ${BOT_KEY}" -H 'content-type: application/json' -d '{}')
            cat out.json; echo
            test "$code" = 200
            grep -q '"more":true' out.json || break
          done
