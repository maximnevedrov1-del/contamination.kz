# {{APP_NAME}}: daily encrypted dump of the Supabase database, kept 30 days as a workflow artifact.
# Copy to .github/workflows/ in the new repo.
# Secrets: SUPABASE_DB_URL (Project Settings -> Database -> connection string, session pooler, user postgres.<project-ref>),
# BACKUP_PASSPHRASE (long random string; keep a copy outside GitHub: without it the dump cannot be read),
# optional TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID for failure alerts.
# Restore: gpg -d {{APP_SLUG}}-*.dump.gpg > db.dump && pg_restore --no-owner -d "$TARGET_DB_URL" db.dump
#   (on a fresh Supabase project "already exists" errors are expected), THEN psql "$TARGET_DB_URL" -f supabase/grants.sql
#   (required: closes the default anon/authenticated privileges and recreates Storage buckets/rules).
# Not in the backup: Storage files, Edge Function secrets, Auth settings.
name: {{APP_SLUG}}-db-backup

on:
  schedule:
    - cron: '17 21 * * *' # 02:17 Almaty
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Fail if secrets are missing
        if: env.SUPABASE_DB_URL == '' || env.BACKUP_PASSPHRASE == ''
        run: echo "::error::SUPABASE_DB_URL / BACKUP_PASSPHRASE secrets are not set" && exit 1
      - name: Install pg_dump 17 (must not be older than the server)
        run: |
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Dump and encrypt
        run: |
          f="{{APP_SLUG}}-$(date -u +%Y%m%d-%H%M).dump"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" -Fc --no-owner --schema=public --schema=auth -f "$f"
          test "$(stat -c %s "$f")" -gt 1024
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 -o "$f.gpg" "$f"
          rm -f "$f"
          echo "FILE=$f.gpg" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 30
          if-no-files-found: error
      - name: Tell the owner the backup failed
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          curl -sS --fail-with-body --retry 3 --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ {{APP_SLUG}}-db-backup failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /dev/null
