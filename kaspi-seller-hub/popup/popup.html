<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Selleros</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="pp-header">
      <div class="pp-brand">
        <img src="../icons/icon-32.png" alt="" width="20" height="20" />
        <span data-i18n="app.name"></span>
      </div>
      <div class="pp-header__actions">
        <div class="seg" role="group" data-i18n-attr="aria-label:common.language" id="langSwitch">
          <button type="button" data-lang="ru">RU</button>
          <button type="button" data-lang="kk">KZ</button>
        </div>
        <button type="button" class="btn btn--ghost btn--icon" id="refreshBtn" data-i18n-attr="title:common.refresh;aria-label:common.refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </div>
    </header>

    <button type="button" class="pp-urgent" id="licenseNotice" hidden></button>

    <section class="pp-totals" id="totals" aria-live="polite"></section>

    <button type="button" class="pp-urgent" id="urgent" hidden></button>

    <section class="pp-stores">
      <h2 class="pp-section-title" data-i18n="popup.storesTitle"></h2>
      <ul id="storeList" class="pp-store-list"></ul>
    </section>

    <footer class="pp-footer">
      <span class="pp-updated" id="updated"></span>
      <button type="button" class="btn btn--primary" id="openDashboard" data-i18n="popup.openDashboard"></button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
