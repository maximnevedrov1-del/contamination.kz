 санатына байланысты; қаптаманы видеоға түсіру бөлек ұйымдастырылады.","Правила Express ↗":"Express ережелері ↗","Подготовка и упаковка ↗":"Дайындау және орау ↗","Меньше вкладок.":"Аз қойынды.","Когда магазины живут в нескольких вкладках и телефонах, время уходит на поиск заказа, сверку статуса и вопрос сборщику. Ниже — пример расчёта для вашего объёма.":"Бірнеше дүкенмен бірнеше қойынды мен бірнеше телефон арқылы қатар жұмыс істегенде, уақыт тапсырысты іздеуге, мәртебені салыстыруға және тапсырыс жинаушыдан сұрауға кетеді. Төменде сіздің көлеміңізге арналған есеп мысалы берілген.","Ваш рабочий день":"Жұмыс күніңіз",пример:"мысал","Минут на заказ сейчас":"Қазір бір тапсырысқа кететін минут","Экономия в день":"Күніне үнем","2 ч 00 мин":"2 сағ 00 мин","в день · не гарантия прибыли":"күніне · пайдаға кепілдік емес","260 000 ₸ / мес":"260 000 ₸ / ай","210 мин":"210 мин","90 мин":"90 мин","Телефон сборщика":"Тапсырыс жинаушының телефоны","Kaspi-магазин 02":"Kaspi дүкен 02","Переключение между окнами":"Терезелер арасында ауысу","у сборщика":"тапсырыс жинаушыда","Следующий шаг виден сразу":"Келесі қадам бірден көрінеді","Продавец видит":"Сатушы","SaudaPulse не меняет товар или рекламу. Он меняет способ управления заказами, когда магазинов и людей становится больше.":"SaudaPulse тауарды немесе жарнаманы өзгертпейді. Дүкендер мен адамдар көбейгенде, ол тапсырыстарды басқару тәсілін өзгертеді.","Работа вручную":"Қолмен жұмыс","Kaspi · Магазин 01":"Kaspi · Дүкен 01","Несколько вкладок и телефонов":"Бірнеше қойынды мен телефон","Статусы уточняются вручную":"Мәртебелер қолмен нақтыланады","Сборщику видно лишнее":"Тапсырыс жинаушыға артық ақпарат көрінеді","Скорость двух сборщиков сложно сравнить":"Екі тапсырыс жинаушының жылдамдығын салыстыру қиын","Express приходится искать по кабинетам":"Express-ті кабинеттерден іздеуге тура келеді","Больше ручных действий · меньше прозрачности":"Қолмен орындалатын әрекеттер көбірек · ашықтық азырақ","Один процесс":"Бір процесс","Все магазины":"Барлық дүкендер","Все магазины в одной очереди":"Барлық дүкендер бір кезекте","Отдельный кабинет сборщика":"Тапсырыс жинаушының бөлек кабинеті","Экономия времени на контроле":"Бақылауға кететін уақыт үнемделеді","Темп и нагрузка каждого сборщика":"Әр тапсырыс жинаушының қарқыны мен жүктемесі","Express выделен, упаковка по шагам":"Express ерекшеленген, орау қадамдарға бөлінген","Больше прозрачности · время на рост магазина":"Ашықтық көбірек · дүкенді дамытуға уақыт","Продавцам с 2–3 Kaspi-магазинами, командой сборки и ежедневным потоком заказов.":"2–3 Kaspi дүкені, тапсырыс жинау командасы және күнделікті тапсырыс ағыны бар сатушыларға.","Тот, кто уже открывает несколько кабинетов, телефонов или таблиц одновременно.":"Бір уақытта бірнеше кабинетті, телефонды немесе кестені ашып қоятын адамға.","Скорость команды под контролем":"Команданың жылдамдығы бақылауда","Сравнение в одном окне.":"Бір терезедегі салыстыру.","Смотрите темп сборки, замечайте задержки":"Жинау қарқынын көріп, кідірістерді байқаңыз","КАБИНЕТ ВЛАДЕЛЬЦА":"ДҮКЕН ИЕСІНІҢ КАБИНЕТІ","Оба начинают заказ из 6 одинаковых товарных единиц. Владелец видит прогресс каждого.":"Екеуі де 6 бірдей тауар бірлігінен тұратын тапсырысты бастайды. Дүкен иесі әрқайсысының ілгерілеуін көреді.","Сборщик · 3 магазина":"Тапсырыс жинаушы · 3 дүкен","Собрано товаров":"Жиналған тауарлар","мин / заказ":"мин / тапсырыс","товара / мин":"тауар / мин",отмечено:"белгіленді","Отмечаются товары":"Тауарлар белгіленеді",Айгерим:"Айгерим","Товарные единицы / активная минута":"Белсенді минутқа шаққандағы тауар бірліктері","Владелец видит разницу":"Дүкен иесі айырмашылықты көреді","Сначала проверьте наличие товара, сложность заказа и паузы. Разный темп сам по себе не означает плохую работу.":"Алдымен тауардың бар-жоғын, тапсырыстың күрделілігін және үзілістерді тексеріңіз. Қарқынның әртүрлі болуы өздігінен нашар жұмысты білдірмейді.","Два задания начаты":"Екі тапсырма басталды",Старт:"Бастау","Первый готов":"Біріншісі дайын","15 секунд анимации показывают 6 минут условного процесса, а не реальное время сборки.":"15 секундтық анимация нақты жинау уақыты емес, шартты процестің 6 минутын көрсетеді.","Темп каждого сборщика":"Әр тапсырыс жинаушының қарқыны","Причины задержек":"Кідіру себептері","Распределение нагрузки":"Жүктемені бөлу","Как сравнивать сборщиков корректно?":"Тапсырыс жинаушыларды қалай дұрыс салыстыруға болады?","В реальном продукте время и отметки товаров нужно фиксировать в кабинете сборщика. Для честного сравнения учитываются состав заказа, склад, маршрут, наличие товара, перерывы и ошибки комплектации. Результаты демонстрации не доказывают гарантированного ускорения команды.":"Нақты өнімде уақыт пен тауарлардың белгіленуін тапсырыс жинаушының кабинетінде тіркеу керек. Әділ салыстыру үшін тапсырыс құрамы, қойма, маршрут, тауардың бар-жоғы, үзілістер және жинақтау қателері ескеріледі. Демонстрация нәтижелері команданың жылдамдығы міндетті түрде артатынын дәлелдемейді.","Скопировали.":"Көшірілді.","Магазин в одном окне.":"Дүкен бір терезеде.","Посмотрите, как может выглядеть подключение.":"Қосылудың қалай көрінуі мүмкін екенін қараңыз.","Банковский счёт не подключается.":"Банк шоты қосылмайды.","Покажите на моём магазине":"Менің дүкенімде көрсетіңіз","Откройте «Настройки → Токен API».":"«Баптаулар → API токені» бөлімін ашыңыз.","Кабинет Kaspi":"Kaspi кабинеті",Настройки:"Баптаулар","Ваш API-токен":"Сіздің API токеніңіз","Вымышленный ключ":"Ойдан шығарылған кілт","Токен скопирован":"Токен көшірілді","Официальная инструкция Kaspi ↗":"Kaspi-дің ресми нұсқаулығы ↗","Название магазина":"Дүкен атауы","Сюда вставляется API-токен":"Мұнда API токені қойылады","Подключить магазин":"Дүкенді қосу","Магазин 03 подключён":"Дүкен 03 қосылды","Магазинов в окне":"Терезедегі дүкендер","Кабинетов сборки":"Жинау кабинеттері",добавлен:"қосылды","Начните с токена API":"API токенінен бастаңыз","Получить токен":"Токен алу","14 секунд — длительность демо, а не гарантия времени настройки.":"14 секунд — демо ұзақтығы, баптау уақытына кепілдік емес.","Понятные границы подключения":"Қосылу шекаралары түсінікті","не подключается.":"қосылмайды.","Вы передаёте токен Магазина на Kaspi.kz для работы с заказами. В этой схеме банковский кабинет остаётся отдельно.":"Тапсырыстармен жұмыс істеу үшін Kaspi.kz-тегі дүкен токенін бересіз. Бұл схемада банк кабинеті бөлек қалады.","Данные для работы команды":"Команда жұмысына арналған деректер","API-токен":"API токені","Для сборки":"Жинау үшін","Для контроля":"Бақылау үшін","Для аналитики":"Аналитика үшін","Вне схемы подключения":"Қосылу схемасынан тыс","Подключение магазина не открывает банковский кабинет":"Дүкенді қосу банк кабинетін ашпайды","Баланс счёта и выписки":"Шот балансы мен үзінді көшірмелер","Переводы и списания":"Аударымдар мен есептен шығарулар","Реквизиты счёта":"Шот деректемелері","Для этой формы нужен API-токен магазина.":"Бұл форма үшін дүкеннің API токені қажет.","Какие данные сервис получает для аналитики?":"Аналитика үшін сервис қандай деректерді алады?","Выручка по заказам в дашборде отличается от баланса банковского счёта.":"Дашбордтағы тапсырыстар түсімі банк шотының балансынан ерекшеленеді.","API-токен даёт доступ к магазину и требует осторожного обращения. Перед настоящим подключением согласуйте получателя токена, условия обработки данных и права доступа. Демо показывает схему, а не результаты аудита рабочего сервиса.":"API токені дүкенге қолжетімділік береді және онымен абайлап жұмыс істеуді талап етеді. Нақты қосылудан бұрын токенді алушыны, деректерді өңдеу шарттарын және қолжетімділік құқықтарын келісіңіз. Демо жұмыс істеп тұрған сервистің аудит нәтижелерін емес, схеманы көрсетеді.","Пароль Kaspi не запрашивается":"Kaspi құпиясөзі сұралмайды","Демо работает на этой странице":"Демо осы бетте жұмыс істейді","Условия до подключения":"Қосылуға дейінгі шарттар","Какие данные передаются при настоящем подключении?":"Нақты қосылу кезінде қандай деректер беріледі?","Банковский кабинет в этой схеме не подключается. При этом данные магазина поступают сервису для обработки заказов. Место и сроки хранения, права доступа и условия обработки данных согласуются перед пилотом. Демо не подтверждает безопасность рабочего backend.":"Бұл схемада банк кабинеті қосылмайды. Соған қарамастан, дүкен деректері тапсырыстарды өңдеу үшін сервиске түседі. Деректерді сақтау орны мен мерзімдері, қолжетімділік құқықтары және деректерді өңдеу шарттары пилот алдында келісіледі. Демо жұмыс істейтін backend қауіпсіздігін растамайды.","Выгода на каждом шаге":"Әр қадамдағы пайда","до готовой посылки.":"дайын сәлемдемеге дейін.",подключены:"қосылған","Один раз настраиваете доступ и больше не собираете картину вручную.":"Бір рет қолжетімділікті баптап, бұдан былай жалпы көріністі қолмен құрастырмайсыз.","Распределяете работу":"Жұмысты бөлесіз","37 заказов":"37 тапсырыс","Печатаете документы и замечаете проблему до того, как она станет отменой.":"Құжаттарды басып шығарып, мәселе тапсырыстан бас тартуға әкелмей тұрып, оны байқайсыз.","Магазин 01 · 3 товара":"Дүкен 01 · 3 тауар","Владелец видит следующий шаг без звонка сборщику":"Дүкен иесі тапсырыс жинаушыға қоңырау шалмай-ақ келесі қадамды көреді","Почему сейчас":"Неге қазір","Управление — разрозненное.":"Басқару — бытыраңқы.","Контроль операционки":"Операциялық жұмысты бақылау","Заказы без статуса":"Мәртебесіз тапсырыстар","Магазины в одной очереди":"Дүкендер бір кезекте",млн:"млн","Kaspi за 1 кв. 2026":"2026 жылдың 1-тоқсанындағы Kaspi","в одном окне":"бір терезеде","для операционки":"операциялық жұмыс үшін","Формат продукта — гипотеза.":"Өнім форматы — гипотеза.","Просто подключить.":"Қосу оңай.","Финальные условия проверим на пилоте с реальными продавцами — без сложных модулей и скрытых доплат.":"Соңғы шарттарды нақты сатушылармен өтетін пилотта тексереміз — күрделі модульдерсіз және жасырын қосымша төлемдерсіз.","1 кабинет":"1 кабинет","Для продавца, который хочет начать с одного кабинета.":"Бір кабинеттен бастағысы келетін сатушыға.",Накладные:"Жүкқұжаттар","О "Дашборд есть у каждой роли":"Әр рөлде өз дашборды бар","Сроки и качество под контролем":"Мерзімдер мен сапа бақылауда","не теряются в очереди.":"кезекте жоғалмайды.","Показать мою очередь заказов →":"Тапсырыстар кезегімді көрсету →","ЖИВОЕ ДЕМО":"ТІКЕЛЕЙ ДЕМО","Срочные заказы видны сразу.":"Шұғыл тапсырыстар бірден көрінеді.","Express в очереди":"Кезектегі Express","Срок требует внимания":"Мерзім назар аударуды қажет етеді","Чек-лист заказа":"Тапсырыс чек-парағы","Очередь сборки":"Жинақтау кезегі",Все:"Барлығы","Магазин 01 · 2 товара":"01-дүкен · 2 тауар",Данияр:"Данияр","Магазин 02 · 3 товара":"Дүкен 02 · 3 тауар","Без сборщика":"Тапсырыс жинаушысыз","Магазин 03 · 1 товар":"03-дүкен · 1 тауар","Уточнить срок в Kaspi":"Мерзімді Kaspi-де нақтылау","Срок неизвестен? Сверьте его в Kaspi. Таймер не подменяет время передачи в кабинете.":"Мерзімі белгісіз бе? Оны Kaspi-де салыстырып тексеріңіз. Таймер кабинеттегі тапсыру уақытын алмастырмайды.","18 мин":"18 мин","Ожидает назначения":"Тағайындалуды күтуде","В очереди":"Кезекте","0 из 3 товаров":"3 тауардың 0-еуі","Товары и комплектующие сверены":"Тауарлар мен құрамдас бөліктер салыстырылды","Упаковка проверена":"Қаптама тексерілді","Накладная прикреплена":"Жүкқұжат тіркелді","Готов к курьеру · демо":"Курьерге дайын · демо","Express-заказ из магазина 02 требует внимания сборщика.":"Дүкен 02-ден келген Express-тапсырыс тапсырыс жинаушының назарын қажет етеді.",Приоритет:"Басымдық",Собрать:"Жинау",Готово:"Дайын","Проверить на моём процессе →":"Өз процесімде тексеру →","Express заметен в очереди всех магазинов. Владелец видит, кто взял заказ и сколько осталось до передачи.":"Express барлық дүкеннің кезегінде бірден көрінеді. Дүкен иесі тапсырысты кім алғанын және тапсыруға қанша уақыт қалғанын көреді.","Комплектность, упаковка и накладная в одном чек-листе. Легче заметить пропущенный шаг до встречи с курьером.":"Тауардың толықтығы, қаптамасы және жүкқұжаты бір чек-парақта. Курьермен кездескенге дейін өткізіп алған қадамды байқау оңай.","Контроль помогает команде избегать ошибок и задержек. Рейтинг и отзывы зависят также от товара и опыта покупателя.":"Бақылау командаға қателер мен кідірістерден сақтануға көмектеседі. Рейтинг пен пікірлер тауарға және сатып алушының тәжірибесіне де байланысты.","Kaspi требует своевременно принимать Express-заказы и передавать их до времени, указанного в кабинете. За нарушения Express могут отключить. Задержки передачи на Kaspi Доставку считаются отдельным показателем качества: это не то же самое, что рейтинг по отзывам.":"Kaspi Express-тапсырыстарды уақытында қабылдап, оларды кабинетте көрсетілген уақытқа дейін тапсыруды талап етеді. Ереже бұзылса, Express қызметін өшіруі мүмкін. Kaspi Доставкаға тапсырудағы кідірістер сапаның бөлек көрсеткіші болып саналады: бұл пікірлерге негізделген рейтингпен бірдей емес.","API документирует признак Express и плановую дату передачи. В пилоте проверим доступность даты и её соответствие сроку в кабинете. При отсутствии даты необходимо уточнить срок в Kaspi. Сервис не гарантирует рост рейтинга или положительные отзывы.":"API Express белгісін және тапсырудың жоспарланған күнін көрсетеді. Пилотта күннің қолжетімділігін және оның кабинеттегі мерзімге сәйкестігін тексереміз. Күн болмаған жағдайда мерзімді Kaspi-де нақтылау қажет. Сервис рейтингтің өсуіне немесе оң пікірлерге кепілдік бермейді.","Рекомендации по рейтингу ↗":"Рейтинг бойынша ұсыныстар ↗","Выгода в минутах":"Минутпен өлшенетін пайда","Больше времени на продажи.":"Сатуға көбірек уақыт.","Расчёт показывает высвобождённое рабочее время. Это не обещание дополнительной прибыли.":"Есеп босаған жұмыс уақытын көрсетеді. Бұл қосымша пайдаға уәде емес.","Допущение: 1,5 мин на заказ в одном окне":"Болжам: бір терезеде бір тапсырысқа 1,5 мин","Заказов в день":"Күніне тапсырыс","Стоимость часа владельца":"Дүкен иесінің бір сағатының құны","120 мин":"120 мин","Потенциал времени":"Уақыт әлеуеті","Если работать 26 дней":"26 күн жұмыс істегенде","Вручную: вкладки + телефоны":"Қолмен: қойындылар + телефондар","В одном окне SaudaPulse":"SaudaPulse-тің бір терезесінде","Рассчитать на моих данных":"Деректерім бойынша есептеу","Новое задание":"Жаңа тапсырма",Статусы:"Мәртебелер","SaudaPulse · всё в одном":"SaudaPulse · бәрі бір жерде","под контролем":"бақылауда","Разница в рабочем дне":"Жұмыс күніндегі айырмашылық","другую картину.":"басқа көріністі көреді.","Без единого окна":"Бірыңғай терезесіз","теряется контроль":"бақылау жоғалады","Где сейчас заказ?":"Тапсырыс қазір қайда?","Владелец постоянно переключается между источниками.":"Дүкен иесі үнемі әртүрлі дереккөздер арасында ауысып отырады.","Проблема обнаруживается, когда клиент уже ждёт.":"Мәселе клиент күтіп қалған кезде анықталады.","Финансы и управление смешаны с рабочими заданиями.":"Қаржы мен басқару жұмыс тапсырмаларымен араласып кетеді.","Без общих отметок времени трудно понять, кто перегружен и где задержался заказ.":"Ортақ уақыт белгілері болмаса, кімге жұмыс көп түскенін және тапсырыстың қай жерде кідіргенін түсіну қиын.","Без общей очереди срочность и срок передачи можно заметить слишком поздно.":"Ортақ кезексіз шұғылдық пен тапсыру мерзімін тым кеш байқауыңыз мүмкін.","С SaudaPulse":"SaudaPulse арқылы","контроль в окне":"терезедегі бақылау","Последний статус виден":"Соңғы мәртебе көрініп тұр","Один экран показывает, что требует внимания.":"Бір экран назар аударуды қажет ететін нәрсені көрсетеді.","Команда видит задания, владелец — цифры и прогресс.":"Команда тапсырмаларды, ал дүкен иесі сандар мен ілгерілеуді көреді.","Меньше переключений, звонков и повторных проверок.":"Ауысулар, қоңыраулар және қайта тексерулер азаяды.","Сравнивайте время, прогресс и количество собранных товаров. Передавайте ожидающие задания тому, кто может их взять.":"Уақытты, ілгерілеуді және жиналған тауарлар санын салыстырыңыз. Күтіп тұрған тапсырмаларды оларды ала алатын адамға беріңіз.","Приоритет, ответственный, срок и чек-лист видны команде в одном процессе.":"Басымдық, жауапты адам, мерзім және чек-парақ командаға бір процесте көрінеді.","Кому подходит":"Кімге арналған","Кто почувствует разницу первым":"Айырмашылықты кім бірінші сезінеді","Понять свой эффект":"Өз әсеріңізді түсіну","Два сборщика.":"Екі тапсырыс жинаушы.","Живой дашборд · демонстрационные данные":"Тікелей дашборд · демонстрациялық деректер","и распределяйте нагрузку по фактам.":"жүктемені нақты деректерге сүйеніп бөліңіз.","Одинаковые заказы. Два сборщика.":"Бірдей тапсырыстар. Екі тапсырыс жинаушы.","Время в примере":"Мысалдағы уақыт","Собрано заказов":"Жиналған тапсырыстар","Среднее время":"Орташа уақыт","Скорость сборки":"Жинау жылдамдығы","6 одинаковых товаров":"6 бірдей тауар","0 мин":"0 мин","Ожидают начала сборки":"Жинаудың басталуын күтуде","Сравнение темпа":"Қарқын салыстыру","Среднее по завершённым заказам в этом примере.":"Осы мысалдағы аяқталған тапсырыстар бойынша орташа көрсеткіш.","Разница среднего времени: 2 мин / заказ":"Орташа уақыт айырмасы: 2 мин / тапсырыс","Передать ожидающее задание →":"Күтіп тұрған тапсырманы беру →","Заказы #KSP-2081 и #KSP-2082 · демонстрация":"#KSP-2081 және #KSP-2082 тапсырыстары · демонстрация",Прогресс:"Ілгерілеу","Баланс нагрузки":"Жүктеме теңгерімі","Хочу видеть скорость своей команды →":"Командамның жылдамдығын көргім келеді →","Сколько товаров собрал и сколько активного времени потратил.":"Қанша тауар жинағанын және қанша белсенді жинау уақытын жұмсағанын.","Прогресс заказа помогает понять, где нужна помощь владельца.":"Тапсырыс барысы дүкен иесінің көмегі қай жерде қажет екенін түсінуге көмектеседі.","Ожидающее задание можно передать другому сборщику.":"Күтіп тұрған тапсырманы басқа тапсырыс жинаушыға беруге болады.","В демо каждый завершённый заказ содержит 6 одинаковых товарных единиц. До текущего задания у каждого по 10 заказов: у Армана 40 минут активной сборки, у Айгерим 60. Скорость — число собранных единиц, делённое на активные минуты. Среднее время — активные минуты, делённые на число завершённых заказов. Текущий заказ включается в эти показатели после завершения.":"Демо нұсқасында әр аяқталған тапсырыста 6 бірдей тауар бірлігі бар. Ағымдағы тапсырмаға дейін әрқайсысы 10 тапсырыстан орындаған: Арман белсенді жинауға 40 минут, Айгерим 60 минут жұмсаған. Жылдамдық — жиналған бірліктер санының белсенді минуттар санына бөліндісі. Орташа уақыт — белсенді минуттар санының аяқталған тапсырыстар санына бөліндісі. Ағымдағы тапсырыс аяқталғаннан кейін бұл көрсеткіштерді есептеуге қосылады.","Подключение видно по шагам":"Қосылу қадамдар бойынша көрінеді","Вставили.":"Қойылды.","Живое демо · 14 секунд":"Тікелей демо · 14 секунд","Для примера нужен только вымышленный API-токен.":"Мысалға тек ойдан шығарылған API токені қажет.","Для настройки не нужны пароль банка, PIN или SMS-коды.":"Баптау үшін банк құпиясөзі, PIN немесе SMS-кодтары қажет емес.","Подключение магазина":"Дүкенді қосу","В кабинете Kaspi руководитель компании формирует токен. Здесь показана схема этого шага.":"Kaspi кабинетінде компания басшысы токен жасайды. Мұнда осы қадамның сызбасы көрсетілген.",Схема:"Сызба","Токен API":"API токені","Токен формирует руководитель компании в веб-кабинете продавца.":"Токенді компания басшысы сатушының веб-кабинетінде жасайды.",Скопировать:"Көшіру","Внутри анимации, не в ваш буфер обмена":"Анимацияның ішінде, алмасу буферіңізде емес","Добавить магазин":"Дүкен қосу","API-токен из кабинета Kaspi":"Kaspi кабинетіндегі API токені","Вставить · демо":"Қою · демо","Токен относится к магазину. Банковский кабинет для этого подключения не нужен. Здесь только демо: реальные ключи вводить нельзя.":"Токен дүкенге тиесілі. Осы қосылуға банк кабинеті қажет емес. Мұнда тек демо: нақты кілттерді енгізуге болмайды.","Пример успешного подключения":"Сәтті қосылу мысалы","Заказов · пример":"Тапсырыстар · мысал","в общем окне":"ортақ терезеде","Ожидает подключения":"Қосылуды күтуде","Ни логин, ни пароль Kaspi в SaudaPulse не вводятся.":"SaudaPulse-қа Kaspi логині де, құпиясөзі де енгізілмейді.",Вставить:"Қою","Помочь мне с подключением →":"Қосылуыма көмектесіңіз →","Банковский счёт":"Банк шоты","API Магазина Kaspi":"Kaspi дүкенінің API-і","Ваш магазин":"Дүкеніңіз","Через API":"API арқылы","Заказы и их состав":"Тапсырыстар және олардың құрамы","Товары и статусы":"Тауарлар мен мәртебелер","Суммы заказов":"Тапсырыс сомалары","Банковский кабинет":"Банк кабинеті","Не подключён":"Қосылмаған","Банковский доступ для этого сценария не запрашивается.":"Бұл сценарий үшін банкке қолжетімділік сұралмайды.","Не запрашиваются":"Сұралмайды","Вне подключения":"Қосылуға қатысы жоқ","Не нужны для настройки":"Баптау үшін қажет емес","Пароль банковского кабинета, PIN и SMS-коды сюда вводить не нужно.":"Банк кабинетінің құпиясөзін, PIN мен SMS-кодтарын мұнда енгізудің қажеті жоқ.","В рабочем сервисе через API поступают данные магазина: товары, заказы, их статусы и суммы. В заказах также могут быть имя, телефон и адрес покупателя. Это нужно для обработки и сборки заказов.":"Жұмыс істеп тұрған сервисте дүкен деректері API арқылы түседі: тауарлар, тапсырыстар, олардың мәртебелері мен сомалары. Тапсырыстарда сатып алушының аты, телефоны және мекенжайы да болуы мүмкін. Бұл тапсырыстарды өңдеу және жинау үшін қажет.","В этой схеме сервис не подключает банковский кабинет и не запрашивает банковские выписки или право проводить переводы.":"Бұл сызбада сервис банк кабинетін қоспайды және банк шотының үзінді көшірмелерін немесе ақша аударымдарын жүргізу құқығын сұрамайды.","Что Kaspi говорит о токене API ↗":"Kaspi API токені туралы не айтады ↗","В схеме подключения вводится API-токен, а не пароль Kaspi.":"Қосылу сызбасында Kaspi құпиясөзі емес, API токені енгізіледі.","Реальные ключи и данные вашего магазина здесь не запрашиваются.":"Мұнда дүкеніңіздің нақты кілттері мен деректері сұралмайды.","Для пилота согласуем доступ и обработку данных заранее.":"Пилот үшін қолжетімділік пен деректерді өңдеуді алдын ала келісеміз.","API-токен даёт доступ к информации о заказах и товарах. В реальном SaaS токен передаётся сервису, а данные магазина поступают через API для общей очереди и аналитики. Заказы могут содержать персональные данные покупателей.":"API токені тапсырыстар мен тауарлар туралы ақпаратқа қолжетімділік береді. Нақты SaaS жүйесінде токен сервиске беріледі, ал ортақ кезек пен талдау үшін дүкен деректері API арқылы түседі. Тапсырыстарда сатып алушылардың дербес деректері болуы мүмкін.","Kaspi предупреждает: не сообщайте токен посторонним. Проверяйте получателя и условия доступа до передачи настоящего ключа. В этом демо используются только вымышленные значения.":"Kaspi ескертеді: токенді бөгде адамдарға бермеңіз. Нақты кілтті бермес бұрын алушыны және қолжетімділік шарттарын тексеріңіз. Бұл демода тек ойдан шығарылған мәндер пайдаланылады.","От подключения":"Қосылудан","Каждый статус виден команде сразу. Владелец понимает, где заказ, а сборщик — что делать дальше.":"Әр мәртебе командаға бірден көрінеді. Дүкен иесі тапсырыстың қайда екенін, ал тапсырыс жинаушы келесі қадамды түсінеді.","Подключаете магазины":"Дүкендерді қосасыз","6 заданий":"6 тапсырма","Сборщик получает понятное задание, а владелец видит прогресс без звонков.":"Тапсырыс жинаушы түсінікті тапсырма алады, ал дүкен иесі ілгерілеуді қоңыраусыз көреді.","Контролируете результат":"Нәтижені бақылайсыз","Путь заказа #KSP-2048":"#KSP-2048 тапсырысының жолы","обновлено сейчас":"қазір жаңартылды","Проверить процесс":"Процесті тексеру","Рынок уже большой.":"Нарық қазірдің өзінде үлкен.","Kaspi сообщил о 73,4 млн e-commerce покупок за 1 квартал 2026 года. Для продавца с несколькими магазинами это означает больше кабинетов, заказов и ручных действий каждый день.":"Kaspi 2026 жылдың 1-тоқсанында e-commerce саласында 73,4 млн сатып алу жасалғанын хабарлады. Бірнеше дүкені бар сатушы үшін бұл күн сайын кабинеттер, тапсырыстар және қолмен орындалатын әрекеттер көбейетінін білдіреді.",сегодня:"бүгін","Сборка под контролем":"Жинақтау бақылауда","Проверить гипотезу вместе":"Болжамды бірге тексеру","e-commerce покупок":"e-commerce сатып алулары","Kaspi-магазина":"Kaspi дүкені",кабинет:"кабинет","Цифра рынка — факт.":"Нарық көрсеткіші — факт.","Тарифная гипотеза":"Тариф гипотезасы","Понятно платить.":"Төлем түсінікті.","Один магазин":"Бір дүкен","₸ / мес":"₸ / ай","Заказы и статусы":"Тапсырыстар мен мәртебелер","Базовые отчёты":"Негізгі есептер","Гипотеза для роста":"Өсу гипотезасы","1 очередь":"1 кезек","Всё из «Один магазин»":"«Бір дүкен» тарифіне кіретіннің бәрі","Дополнительный кабинет":"Қосымша кабинет","от 5 000":"5 000-нан бастап","Дополнительные Kaspi-магазины":"Қосымша Kaspi дүкендері","Поддержка в Telegram":"Telegram-дағы қолдау","Первые 20 команд":"Алғашқы 20 команда","где болит.":"мәселе қай жерде екенін.","Пилот — это не обещание готового продукта. Это совместная проверка сценария на ваших реальных процессах.":"Пилот — дайын өнімге берілетін уәде емес. Бұл — сценарийді нақты процестеріңізде бірге тексеру.","Телефон или Telegram":"Телефон немесе Telegram","1 магазин":"1 дүкен","Примерный объём заказов в день":"Күніне түсетін тапсырыстардың шамамен саны","Соглашаюсь на обработку данных для связи по пилоту.":"Пилот бойынша байланысу үшін деректерімді өңдеуге келісемін.","Демо-форма для проверки гипотезы. После запуска заявки будут уходить команде SaudaPulse.":"Болжамды тексеруге арналған демо-форма. Іске қосылғаннан кейін өтінімдер SaudaPulse командасына жіберіледі.","SaudaPulse, на главную":"SaudaPulse, басты бетке","Открыть меню":"Мәзірді ашу","Выберите этап демонстрации":"Демонстрация кезеңін таңдаңыз","Фильтр заказов":"Тапсырыстар сүзгісі","Воспроизвести сравнение сборщиков":"Тапсырыс жинаушыларды салыстыруды ойнату","Воспроизвести демо подключения":"Қосылу демосын ойнату","Магазин передаёт данные через токен API в SaudaPulse":"Дүкен деректерді API токені арқылы SaudaPulse-қа жібереді","SaudaPulse — все магазины Kaspi в одном окне":"SaudaPulse — барлық Kaspi дүкендері бір терезеде","Этап 1 из 6. Новый. Заказ из магазина 02 появляется рядом с заказами других магазинов.":"6 кезеңнің 1-кезеңі. Жаңа. Дүкен 02-ден келген тапсырыс басқа дүкендердің тапсырыстарының жанына шығады.","Вы приняли заказ в одном окне.":"Тапсырысты бір терезеде қабылдадыңыз.",Принят:"Қабылданды","Назначить сборщика":"Тапсырыс жинаушыны тағайындау","Арман назначен":"Арман тағайындалды","Ответственный: сборщик Арман":"Жауапты: тапсырыс жинаушы Арман","Сборщик получает своё задание.":"Тапсырыс жинаушы өз тапсырмасын алады.","Следующий шаг: проверить комплектацию":"Келесі қадам: тапсырыстың толықтығын тексеру","В сборке у Армана":"Арман жинап жатыр","Арман начал сборку":"Арман жинауды бастады","Этап 4 из 6. Проверен. Отметки сборщика видны владельцу. По примеру заказа собрано 3 из 3 товаров.":"6 кезеңнің 4-кезеңі. Тексерілді. Тапсырыс жинаушының белгілері дүкен иесіне көрінеді. Мысалдағы тапсырыстың 3 тауарының 3-еуі жиналды.","Отметки сборщика видны владельцу. По примеру заказа собрано 3 из 3 товаров.":"Тапсырыс жинаушының белгілері дүкен иесіне көрінеді. Мысалдағы тапсырыстың 3 тауарының 3-еуі жиналды.","Следующий шаг: подготовить документы":"Келесі қадам: құжаттарды дайындау","Готов к отгрузке":"Жөнелтуге дайын","Комплектация проверена":"Тапсырыстың толықтығы тексерілді","Этап 5 из 6. Накладная готова. Накладная подготовлена в том же процессе. Не нужно снова искать магазин и заказ.":"6 кезеңнің 5-кезеңі. Жүкқұжат дайын. Жүкқұжат сол процесте дайындалды. Дүкен мен тапсырысты қайта іздеудің қажеті жоқ.","Накладная подготовлена в том же процессе. Не нужно снова искать магазин и заказ.":"Жүкқұжат сол процесте дайындалды. Дүкен мен тапсырысты қайта іздеудің қажеті жоқ.","Передать на отгрузку":"Жөнелтуге беру","Посылка упакована":"Сәлемдеме қапталды","Демонстрационный документ · #KSP-2053":"Демонстрациялық құжат · #KSP-2053","Заказ передан. Владелец видит результат.":"Тапсырыс тапсырылды. Дүкен иесі нәтижені көреді.",Отгружен:"Жөнелтілді","Заказ завершён":"Тапсырыс аяқталды","Задание выполнено":"Тапсырма орындалды","Пример сценария завершён":"Сценарий мысалы аяқталды","Скопируйте API-токен.":"API токенін көшіріңіз.",Скопировано:"Көшірілді","Токен скопирован в демо":"Токен демоға көшірілді","Шаг 2 из 5. Скопируйте API-токен.":"5 қадамның 2-қадамы. API токенін көшіріңіз.","Укажите понятное название магазина и вставьте его токен в поле подключения.":"Дүкеннің түсінікті атауын көрсетіп, оның токенін қосылу өрісіне қойыңыз.","Токен на месте":"Токен орнында","Шаг 3 из 5. Вставьте токен в SaudaPulse.":"5 қадамның 3-қадамы. Токенді SaudaPulse-қа қойыңыз.","Сервис проверяет API-доступ. В анимации проверка имитируется, запрос в Kaspi не отправляется.":"Сервис API-ға қолжетімділікті тексереді. Анимацияда тексеру имитацияланады, Kaspi-ге сұрау жіберілмейді.","Проверяем доступ":"Қолжетімділікті тексеріп жатырмыз","Шаг 4 из 5. Нажмите «Подключить магазин».":"5 қадамның 4-қадамы. «Дүкенді қосу» түймесін басыңыз.","Пример готов: три магазина в одной очереди. Для следующего магазина повторяется тот же сценарий.":"Мысал дайын: үш дүкен бір кезекте. Келесі дүкен үшін осы сценарий қайталанады.","Магазин 03 добавлен":"03-дүкен қосылды","Шаг 5 из 5. Магазин появился в общем окне.":"5 қадамның 5-қадамы. Дүкен ортақ терезеде пайда болды.","Сборщик видит приоритет.":"Тапсырыс жинаушы басымдықты көреді.","Задержка 6 мин":"6 мин кідіріс",Амина:"Амина","29 мин до передачи":"Тапсыруға дейін 29 мин","Шаг 2 из 5. Сборщик видит приоритет.":"5 қадамның 2-қадамы. Тапсырыс жинаушы басымдықты көреді.","У заказа три товара. Перед упаковкой сборщик проверяет позиции, количество и комплектующие.":"Тапсырыста үш тауар бар. Орау алдында тапсырыс жинаушы тауарларды, санын және жиынтықтағы бөлшектерді тексереді.","14 мин до передачи":"Тапсыруға дейін 14 мин","14 мин":"14 мин","Шаг 3 из 5. Сначала сверить комплектацию.":"5 қадамның 3-қадамы. Алдымен жинақталуын тексеріңіз.","Отметки делает сотрудник. Чек-лист помогает не пропустить шаг, но не проверяет посылку вместо человека.":"Белгілерді қызметкер қояды. Чек-парақ қадамды өткізіп алмауға көмектеседі, бірақ сәлемдемені адамның орнына тексермейді.","12 мин до передачи":"Тапсыруға дейін 12 мин","Проверьте упаковку и накладную до отметки готовности.":"Дайындық белгісін қоймас бұрын қаптама мен жүкқұжатты тексеріңіз.","Готовность подтверждает сотрудник.":"Дайындықты қызметкер растайды.","Задержка 12 мин":"12 мин кідіріс","23 мин до передачи":"Тапсыруға дейін 23 мин","Отметьте проверки вручную и подтвердите готовность кнопкой.":"Тексерулерді қолмен белгілеп, дайындықты түйме арқылы растаңыз.","Передайте ожидающее задание.":"Күтіп тұрған тапсырманы беріңіз.","Заказ готов":"Тапсырыс дайын","Комплектация завершена":"Жиынтықтау аяқталды","Задание передано · демо":"Тапсырма берілді · демо","#KSP-2083: Айгерим → Арман · пример действия владельца":"#KSP-2083: Айгерим → Арман · дүкен иесінің әрекетінің мысалы","Готов к курьеру":"Курьерге дайын",Пауза:"Кідірту","Поставить Express-демо на паузу":"Express-демоны кідірту","Одинаковые заказы. Два сборщика. Оба начинают заказ из 6 одинаковых товарных единиц. Владелец видит прогресс каждого.":"Бірдей тапсырыстар. Екі тапсырыс жинаушы. Екеуі де 6 бірдей тауар бірлігінен тұратын тапсырысты бастайды. Дүкен иесі әрқайсысының ілгерілеуін көреді.","Арман отметил 3 товара, Айгерим — 2. Текущий статус рядом со временем сборки.":"Арман 3 тауарды, Айгерим 2 тауарды белгіледі. Ағымдағы мәртебе жинау уақытының жанында.","Отметки сборщиков обновились":"Тапсырыс жинаушылардың белгілері жаңартылды","Прогресс виден без звонков. Арман отметил 3 товара, Айгерим — 2. Текущий статус рядом со временем сборки.":"Ілгерілеу қоңыраусыз көрінеді. Арман 3 тауарды, Айгерим 2 тауарды белгіледі. Ағымдағы мәртебе жинау уақытының жанында.","Арман завершил заказ за 4 минуты. Айгерим собирает оставшиеся 2 товара.":"Арман тапсырысты 4 минутта аяқтады. Айгерим қалған 2 тауарды жинап жатыр.","У Айгерим осталось 2 товара: можно проверить причину задержки.":"Айгеримде 2 тауар қалды: кідіріс себебін тексеруге болады.","Сравнивайте время и состав заказа.":"Уақыт пен тапсырыс құрамын салыстырыңыз.","Оба заказа собраны":"Екі тапсырыс та жиналды","Сравнивайте время и состав заказа. Оба заказа готовы. В примере разница — 2 минуты на одинаковый набор товаров.":"Уақыт пен тапсырыс құрамын салыстырыңыз. Екі тапсырыс та дайын. Мысалда бірдей тауарлар жиынтығын жинау уақытындағы айырмашылық — 2 минут.",магазин:"дүкен",товара:"тауар",Задержка:"Кідіріс",Шаг:"Қадам",из:"ішінен","Приостановить демонстрацию":"Демонстрацияны кідірту","Демонстрация воспроизводится.":"Демонстрация ойнатылып жатыр.","Приостановить сравнение сборщиков":"Тапсырыс жинаушыларды салыстыруды кідірту",Спасибо:"Рақмет","Выберите сценарий и покажем, где окупается единое окно":"Сценарийді таңдаңыз, бірыңғай терезенің қай жерде өзін ақтайтынын көрсетеміз","1 окно  ·  3 магазина  ·  2 роли":"1 терезе  ·  3 дүкен  ·  2 рөл","Сумма:":"Сома:",Демо:"Демо","Для продавцов Kaspi в Казахстане":"Қазақстандағы Kaspi сатушыларына арналған","Владелец контролирует заказы и продажи. Сборщик получает свои задания без доступа к финансам и настройкам.":"Дүкен иесі тапсырыстар мен сатылымдарды бақылайды. Тапсырыс жинаушы тек өз тапсырмаларын алады, қаржы мен баптауларға қол жеткізе алмайды.","Для владельца магазина и команды сборки":"Дүкен иесі мен тапсырыс жинау тобына арналған","Сегодня · демо":"Бүгін · демо","Четыре экрана для ежедневной работы":"Күнделікті жұмысқа арналған төрт экран","Переключайте заказы, отгрузки, приём и аналитику.":"Тапсырыстар, жөнелтулер, қабылдау және аналитика бөлімдері арасында ауысыңыз.","Доступы по ролям":"Рөлдер бойынша рұқсаттар","Оцените экономию времени при вашем объёме заказов. Измените параметры и сравните ручную работу с единым окном.":"Тапсырыс көлеміңізге қарай қанша уақыт үнемделетінін бағалаңыз. Параметрлерді өзгертіп, қолмен жұмыс істеу мен бірыңғай терезедегі жұмысты салыстырыңыз.","Стоимость высвобождённого времени":"Босаған уақыттың құны","в день · оценка по ставке часа":"күніне · сағаттық мөлшерлеме бойынша бағалау","Расчётный пример: 1,5 минуты на заказ в SaudaPulse. Результат оценива
