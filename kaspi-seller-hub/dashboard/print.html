<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kaspi Seller Hub</title>
    <link rel="icon" href="../icons/icon-32.png" />
    <link rel="stylesheet" href="../shared/tokens.css" />
    <style>
      @page { size: A4; margin: 10mm; }
      body { background: var(--surface-2); }
      .bar {
        position: sticky; top: 0; z-index: 2;
        display: flex; align-items: center; gap: 12px;
        padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
      }
      .bar h1 { margin: 0; font-size: 16px; font-weight: 600; }
      .bar .muted { color: var(--text-3); font-size: 13px; }
      .bar .spacer { flex: 1; }
      .notice { margin: 16px auto 0; width: 210mm; padding: 10px 14px; border-radius: var(--radius); background: var(--warn-bg); font-size: 13px; }
      .pages { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px; }
      .page {
        width: 210mm; min-height: 297mm; padding: 10mm; background: #fff; color: #000;
        box-shadow: var(--shadow-lg); border-radius: 4px; position: relative; overflow: hidden;
      }
      .page__label { position: absolute; top: 3mm; right: 5mm; font: 9px var(--font-sans); color: #888; }
      .page img.pdf-page { display: block; width: 100%; height: auto; }
      .page iframe { width: 100%; height: 270mm; border: 0; }
      .page--sheet { padding: 0; }
      .page--sheet img.pdf-page { width: 100%; height: 100%; object-fit: contain; }
      .orig-link { margin: -8px 0 0; font-size: 13px; }
      .pick-photo { width: 52px; padding: 3px !important; }
      .pick-photo img { display: block; width: 46px; height: 46px; object-fit: contain; }
      .empty { padding: 80px; text-align: center; color: var(--text-3); }
      .pick { font: 12px var(--font-sans); }
      .pick h2 { margin: 0 0 4px; font-size: 18px; }
      .pick-meta { margin: 0 0 12px; color: #555; }
      .pick table { width: 100%; border-collapse: collapse; }
      .pick th, .pick td { border: 1px solid #bbb; padding: 6px 8px; text-align: left; vertical-align: top; }
      .pick th { background: #f2f2f2; font-weight: 600; }
      .pick .num { text-align: right; } .pick .qty { font-size: 16px; font-weight: 700; }
      .pick .box { width: 28px; text-align: center; font-size: 16px; }
      .pick .mono { font-family: var(--font-mono); font-size: 11px; }
      .pick-order { display: inline-flex; align-items: center; gap: 4px; margin: 0 8px 2px 0; white-space: nowrap; }
      .pick-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .pick-unknown { margin-top: 12px; padding: 8px; border: 1px dashed #999; }
      @media print {
        body { background: #fff; }
        .bar, .notice, .page__label, .no-print { display: none !important; }
        .pages { padding: 0; gap: 0; display: block; }
        .page { width: auto; min-height: 0; padding: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
        .page:last-child { break-after: auto; page-break-after: auto; }
        .page--sheet { overflow: hidden; }
        img { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <h1 data-i18n="print.title"></h1>
      <span class="muted" id="count"></span>
      <span class="spacer"></span>
      <button type="button" class="btn btn--primary" id="printBtn" data-i18n="print.print"></button>
    </div>
    <div id="notices"></div>
    <div class="pages" id="pages"></div>
    <script type="module" src="print.js"></script>
  </body>
</html>
