<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SaudaPulse</title>
    <link rel="icon" href="../icons/icon-32.png" />
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div>
            <img class="logo-on-dark" src="../icons/logo-full.svg" alt="SaudaPulse" height="24" /><img class="logo-on-light" src="../icons/logo-full-light.svg" alt="SaudaPulse" height="24" />
            <div class="brand__tag" data-i18n="app.tagline"></div>
          </div>
        </div>

        <nav class="nav" data-i18n-attr="aria-label:app.name">
          <a class="nav__item" href="#home" data-route="home" data-ux-key="nav_home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
            <span data-i18n="nav.home"></span>
          </a>
          <div class="nav__group" data-i18n="nav.group.work"></div>
          <a class="nav__item" href="#orders" data-route="orders" data-ux-key="nav_orders">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>
            <span data-i18n="nav.orders"></span><span class="nav__urgent" data-count="urgent"></span><span class="nav__count" data-count="orders"></span>
          </a>
          <a class="nav__item" href="#returns" data-route="returns" data-ux-key="nav_returns">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
            <span data-i18n="nav.returns"></span><span class="nav__count" data-count="returns"></span>
          </a>
          <a class="nav__item" href="#refusals" data-route="refusals" data-ux-key="nav_refusals">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>
            <span data-i18n="nav.refusals"></span><span class="nav__count" data-count="refusals"></span>
          </a>
          <a class="nav__item" href="#chat" data-route="chat" data-ux-key="nav_chat">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
            <span data-i18n="nav.chat"></span><span class="nav__count nav__count--accent" data-count="chat"></span>
          </a>
          <div class="nav__group" data-i18n="nav.group.money"></div>
          <a class="nav__item" href="#payments" data-route="payments" data-ux-key="nav_payments">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h3"/></svg>
            <span data-i18n="nav.payments"></span><span class="nav__count" data-count="payments"></span>
          </a>
          <a class="nav__item" href="#analytics" data-route="analytics" data-ux-key="nav_analytics">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
            <span data-i18n="nav.analytics"></span>
          </a>
          <div class="nav__group" data-i18n="nav.group.goods"></div>
          <a class="nav__item" href="#catalog" data-route="catalog" data-ux-key="nav_catalog">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
            <span data-i18n="nav.catalog"></span>
          </a>
          <a class="nav__item" href="#products" data-route="products" data-ux-key="nav_products">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="8" cy="8" r="1.5"/></svg>
            <span data-i18n="nav.products"></span>
          </a>
          <div class="nav__group" data-i18n="nav.group.other"></div>
          <a class="nav__item" href="#settings" data-route="settings" data-ux-key="nav_settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            <span data-i18n="nav.settings"></span>
          </a>
          <a class="nav__item" href="#account" data-route="account" data-ux-key="nav_account">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
            <span data-i18n="nav.account"></span>
          </a>
          <a class="nav__item" href="#help" data-route="help" data-ux-key="nav_help">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7"/><path d="M12 17h.01"/></svg>
            <span data-i18n="nav.help"></span><span class="nav__count nav__count--accent" data-count="help"></span>
          </a>
        </nav>

        <div class="sidebar__stores">
          <a class="plan-chip" id="planChip" href="#account" hidden></a>
          <div class="sidebar__label" data-i18n="nav.stores"></div>
          <ul id="sidebarStores" class="sidebar__store-list"></ul>
          <button type="button" class="btn btn--sm sidebar__connect" id="connectStoreBtn" data-ux-key="btn_connect_store" data-i18n="connect.button"></button>
        </div>
      </aside>

      <div class="scrim" id="scrim" hidden></div>
      <div class="main">
        <header class="topbar">
          <button type="button" class="btn btn--ghost btn--icon menu-btn" id="menuBtn" aria-controls="sidebar" aria-expanded="false" data-i18n-attr="aria-label:common.menu;title:common.menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="topbar__title">
            <h1 id="pageTitle"></h1>
            <p id="pageSubtitle"></p>
          </div>
          <div class="topbar__controls">
            <div id="storeMeter"></div>
            <button type="button" class="btn btn--sm filters-toggle" id="filtersToggle" aria-expanded="false" aria-controls="dataFilters" hidden></button>
            <div class="topbar__filters" id="dataFilters">
            <label class="sr-only" for="storeFilter" data-i18n="topbar.storeFilter"></label>
            <select id="storeFilter" class="select"></select>

            <div class="seg" role="group" id="rangeSeg" data-i18n-attr="aria-label:topbar.dateRange">
              <button type="button" data-preset="7" data-i18n="topbar.last7"></button>
              <button type="button" data-preset="30" data-i18n="topbar.last30"></button>
              <button type="button" data-preset="90" data-i18n="topbar.last90"></button>
              <button type="button" data-preset="custom" data-i18n="topbar.custom"></button>
            </div>
            <div class="date-range" id="customRange" hidden>
              <label class="sr-only" for="dateFrom" data-i18n="topbar.from"></label>
              <input type="date" id="dateFrom" class="input" />
              <span aria-hidden="true">–</span>
              <label class="sr-only" for="dateTo" data-i18n="topbar.to"></label>
              <input type="date" id="dateTo" class="input" />
            </div>
            </div>

            <div class="seg" role="group" id="langSwitch" data-i18n-attr="aria-label:common.language">
              <button type="button" data-lang="ru">RU</button>
              <button type="button" data-lang="kk">KZ</button>
            </div>
            <button type="button" class="btn btn--ghost btn--icon" id="themeToggle" hidden data-i18n-attr="title:topbar.themeToggle;aria-label:topbar.themeToggle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
            <button type="button" class="btn btn--ghost btn--icon" id="guideBtn" data-ux-key="btn_guide" data-i18n-attr="title:guide.button;aria-label:guide.button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7"/><path d="M12 17h.01"/></svg>
            </button>
            <button type="button" class="btn" id="refreshBtn" data-ux-key="btn_refresh">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
              <span id="refreshLabel" data-i18n="common.refresh"></span>
            </button>
          </div>
        </header>
        <div class="topbar__meta"><span id="lastSync"></span><div class="progress" id="progress" hidden><div class="progress__bar"></div><span class="progress__label"></span></div></div>

        <!-- The one advertising placement (dashboard/ad-banner.js). Hidden and zero-height unless the server returns ads. -->
        <section id="adSlot" class="ad-slot" data-ad-state="idle" hidden></section>
        <div id="banners" class="banners" aria-live="polite"></div>
        <main id="view" class="view" tabindex="-1"></main>
      </div>
    </div>

    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

    <!-- Kaspi payment: filled by dashboard.js (renewal, add-on stores, blocked cabinet) -->
    <dialog id="payDialog" class="dialog dialog--pay" aria-labelledby="payTitle"></dialog>
    <dialog id="termsDialog" class="dialog dialog--pay" aria-labelledby="termsTitle"></dialog>

    <!-- Simple "connect a store" form -->
    <dialog id="connectDialog" class="dialog" data-ux-form aria-labelledby="connectTitle">
      <form method="dialog" id="connectForm">
        <h2 class="dialog__title" id="connectTitle" data-i18n="connect.title"></h2>
        <p class="dialog__text" data-i18n="connect.text"></p>
        <label class="connect__field"><span data-i18n="connect.name"></span><input class="input" id="connectName" autocomplete="off" required /></label>
        <label class="connect__field"><span data-i18n="connect.token"></span><input class="input" id="connectToken" type="password" autocomplete="off" required /></label>
        <p class="field__hint" data-i18n="connect.howTo"></p>
        <button type="button" class="btn btn--sm" id="connectTokenHelp" data-ux-key="act_token-help" data-i18n="connect.whereToken"></button>
        <details class="connect__safe" data-block="token-safe"><summary data-i18n="onboard.safeTitle"></summary><p data-i18n="onboard.safeText"></p></details>
        <div id="connectOwner"></div>
        <p class="field__hint" id="connectPrice"></p>
        <div class="banner" id="connectError" role="alert" hidden></div>
        <div class="dialog__actions">
          <button type="button" value="cancel" class="btn" id="connectCancel" data-i18n="common.cancel"></button>
          <button type="submit" value="ok" class="btn btn--primary" id="connectSubmit" data-i18n="connect.submit"></button>
        </div>
      </form>
    </dialog>

    <dialog id="confirmDialog" class="dialog">
      <form method="dialog">
        <h2 class="dialog__title"></h2>
        <p class="dialog__text"></p>
        <div class="dialog__actions">
          <button type="submit" value="cancel" class="btn" data-i18n="common.cancel"></button>
          <button type="submit" value="ok" class="btn btn--primary" data-i18n="common.confirm"></button>
        </div>
      </form>
    </dialog>

    <script type="module" src="dashboard.js"></script>
    <!-- «Компьютер склада»: sign-in screen and the packer panel (dashboard/staff-view.js) -->
    <div id="staffRoot" hidden></div>
  </body>
</html>
