<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Открыть SaudaPulse</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/icon-32.png" sizes="32x32">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<!-- Target of the Telegram buttons «📦 Посмотреть заказы» (/open#orders). Telegram opens only https
     links, and a web page cannot open an extension by itself: the page says how, in one step. -->
<main class="wrap" style="min-height:100vh;display:grid;place-content:center;justify-items:center;gap:18px;text-align:center;max-width:560px">
  <a class="logo" href="/"><img src="/assets/icon-128.png" alt="" width="32" height="32"><span>SaudaPulse</span></a>
  <h1 id="title">Откройте SaudaPulse</h1>
  <p class="lead" style="margin:0">На компьютере в Chrome нажмите значок <b>SaudaPulse</b> справа от адресной строки (или значок пазла → SaudaPulse) и выберите «Открыть панель».</p>
  <p id="phone" class="lead" style="margin:0" hidden>Вы открыли ссылку на телефоне. SaudaPulse работает в Chrome на компьютере — откройте его там.</p>
  <a class="btn btn--primary" href="/">О SaudaPulse</a>
</main>
<script>
  // the section the button meant (#orders, #home, #account) — only for the heading
  var names = { orders: 'Заказы', home: 'Главная', account: 'Подписка' };
  var r = location.hash.slice(1);
  if (names[r]) document.getElementById('title').textContent = 'Откройте SaudaPulse → ' + names[r];
  if (/Android|iPhone|iPad/.test(navigator.userAgent)) document.getElementById('phone').hidden = false;
</script>
</body>
</html>
